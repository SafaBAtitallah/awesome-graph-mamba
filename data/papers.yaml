# =====================================================================
# Curated paper database — single source of truth for survey-derived
# information. Bibliographic metadata (title, authors, year, venue,
# DOI/arXiv) is NOT duplicated here: it is resolved from
# source/references.bib at build time.
#
# Provenance rules
#   * Every field is transcribed or condensed from the manuscript
#     (source/main.tex); `sections` lists the manuscript labels.
#   * "NR" = not reported in the survey. Nothing is filled from
#     external sources.
#   * verification.status:
#       extracted           -> taken from the manuscript, not yet
#                              checked by an author
#       needs_verification  -> ambiguous or conflicting in manuscript
#       verified            -> checked by an author; scripts never
#                              overwrite a verified record
#   * Valid values for setting / levels / types / domains / patterns
#     are defined in data/taxonomy.yaml.
# =====================================================================

papers:

# ---------------------------------------------------------------------
# Static and general-purpose graph models (subsec:static-models)
# ---------------------------------------------------------------------
- key: huang2024can
  model: GSSC
  roles: [taxonomy]
  sections: [subsec:static-models, subsec:order-sensitivity, subsec:long-range, subsec:complexity, sec:efficiency-eval, sec:ch-expressivity, sec7]
  taxonomy:
    setting: static_general
    d1: "Node features and graph positional information"
    d2: "Order-free"
    d3: [operator]
    d4: [standalone]
  methodology: "Extends state-space convolution to graphs with global permutation-equivariant set aggregation and factorizable graph kernels built from structural and relative positional information; avoids explicit graph-to-sequence serialization."
  contributions:
    - "Operator-level incorporation of graph structure into the state-space convolution rather than through a node ordering."
    - "Permutation equivariance identified as a property of the operator (architectural guarantee)."
    - "Proof that a graph-kernel parameterization exists for which the gradient between two node representations does not decay with shortest-path distance."
  complexity: "$O(nmd)$ for the graph state-space convolution ($n$ nodes; $m$ hidden and $d$ positional-encoding dimensions)"
  efficiency:
    scaling: "Linear-time structured state-space propagation"
    additional_costs: "Graph-kernel and positional/spectral preprocessing"
    evidence: "Reports graph-size-dependent linear propagation complexity; preprocessing evaluated separately (Laplacian PE eigendecomposition can be non-negligible; only required eigenpairs computed iteratively for larger graphs)"
  expressivity:
    permutation_property: "Equivariant by construction"
    result: "Strictly more powerful than 1-WL and not more powerful than 3-WL; counts 3-paths and 3-cycles, and 4-paths and 4-cycles when the selection mechanism is added"
    caveat: "Not a serialization-based model; relies on a factorizable distance kernel built from PE"
  advantages:
    - "Permutation equivariant and long-range without node serialization (order sensitivity S(G)=0 by construction)."
  limitations:
    - "Laplacian positional-encoding eigendecomposition can become a non-negligible preprocessing cost."
  notes:
    - "Cited as early work for end-to-end scalability, serialization/permutation, and expressive power (tab:future-directions)."
  verification: {status: extracted, flags: []}

- key: behrouz2024graph
  model: GMN
  aliases: ["Graph Mamba Network"]
  roles: [taxonomy]
  sections: [subsec:static-models, subsec:order-sensitivity, subsec:long-range, subsec:complexity, sec:efficiency-eval, sec:ch-serialization-robustness, sec:ch-expressivity, sec7]
  taxonomy:
    setting: static_general
    d1: "Neighborhood/subgraph tokens"
    d2: "Ordered, bidirectional"
    d3: [input]
    d4: [parallel]
  methodology: "Framework of neighborhood tokenization, token ordering, local encoding, and a bidirectional selective SSM encoder; sampled neighborhood structures become graph tokens; optional message-passing module adds local inductive bias."
  contributions:
    - "Graph structure introduced primarily through token construction (D1) and ordering with bidirectional scanning (D2)."
    - "Complexity analysis that explicitly includes token construction."
  complexity: "$O(Ms(m+1)\\lvert V\\rvert + \\lvert E\\rvert)$ in the subgraph-token setting ($M$, $s$, $m$ control sampling and token construction); linear in $\\lvert V\\rvert$ with node tokens; $O(\\lvert V\\rvert + \\lvert E\\rvert)$ with the optional message-passing component"
  efficiency:
    scaling: "Linear in processed graph-token sequence length"
    additional_costs: "Neighborhood sampling and optional message passing"
    evidence: "Complexity depends on sampling parameters and graph size"
  expressivity:
    permutation_property: "Not guaranteed (ordered tokens, bidirectional scan)"
    result: "Universal approximator of permutation-equivariant functions given PE; with suitable PE/SE more expressive than any WL test, matching graph Transformers; unbounded power without PE/SE when a random-walk neighborhood encoder is used"
    caveat: "Part of the power is attributed by the authors to neighborhood sampling and encoding rather than to the selective SSM"
  advantages:
    - "Bidirectional processing removes the privileged causal direction of a single forward scan."
  limitations:
    - "Computation still operates on a particular token sequence (no permutation guarantee)."
    - "Improvements cannot be attributed to the SSM independently of the tokenization procedure."
    - "Explicit trade-off between richer/longer token sequences and computational cost."
  verification: {status: extracted, flags: []}

- key: wang2024graph
  model: Graph-Mamba
  roles: [taxonomy]
  sections: [subsec:static-models, subsec:order-sensitivity, subsec:long-range, subsec:complexity, sec:efficiency-eval, sec:ch-serialization-robustness, sec7]
  taxonomy:
    setting: static_general
    d1: "Node representations"
    d2: "Degree-based prioritization and permutation"
    d3: [input]
    d4: [parallel]
  methodology: "Graph-centric node prioritization (degree by default; ties randomly permuted during training) followed by a Graph-Mamba Block that replaces the global attention of GraphGPS, with an MPNN branch for local processing; multiple permuted outputs averaged at inference."
  contributions:
    - "Serialization and scanning (D2) with local--global graph--SSM integration (D4)."
    - "Ablation showing node-level permutation with degree-based prioritization outperforms the alternatives evaluated."
  complexity: "$O(L)$ for the Graph-Mamba Block with respect to input sequence length $L$ (hardware-aware Mamba implementation)"
  efficiency:
    scaling: "Linear Mamba global block"
    additional_costs: "Node prioritization, permutation, sequence construction"
    evidence: "Reports reduced GPU memory usage on large-graph experiments (up to 74%); binning strategy splits long node sequences for larger graphs"
  advantages:
    - "Permutation-based training reduces sequence-related bias and improves stability (empirical strategy)."
  limitations:
    - "Empirical, not architectural, mitigation of order dependence."
    - "Practical cost includes binning, prioritization, and permutation beyond the selective scan."
  verification: {status: extracted, flags: []}

