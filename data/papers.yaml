- key: behrouz2024best
  model: GSM++
  aliases: ["Graph sequence models", "Best of both worlds"]
  roles: [discussed]
  sections: [sec:ch-expressivity, sec:ch-hybrid, sec7]
  methodology: "Applies Mamba layers followed by a Transformer block to hierarchically tokenized graphs; accompanying task-based analysis of graph sequence models."
  contributions:
    - "Reports improvements over both pure backbones on most of its benchmarks (hybrid attention--SSM)."
    - "Comparison of sequence backbones including Mamba and Mamba-2 within one graph pipeline found none uniformly best."
  expressivity:
    permutation_property: "Depends on tokenizer and backbone"
    result: "Task-based analysis beyond WL: recurrent backbones can count node colors when the state width is at least the number of colors, which non-causal Transformers without PE cannot; worst-case connectivity favors Transformers (logarithmic depth), whereas recurrent models need polynomial depth or width unless the ordering is locality-preserving"
    caveat: "Sensitivity of SSM outputs decays with token distance and deep stacks exhibit representational collapse; no single backbone dominates"
  verification:
    status: needs_verification
    flags:
      - "Not classified in tab:unified-taxonomy; D1--D4 left unassigned."

