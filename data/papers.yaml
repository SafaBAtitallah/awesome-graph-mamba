  limitations:
    - "Self-supervised objective does not produce an encoder reused on other graphs (sec:ch-pretraining)."
  verification: {status: extracted, flags: []}

# ---------------------------------------------------------------------
# Dynamic and spatio-temporal graph models (subsec:dynamic-models)
# ---------------------------------------------------------------------
- key: li2024state
  model: GraphSSM
  roles: [taxonomy]
  sections: [subsec:dynamic-models, sec:ch-complex-graphs, sec7]
  taxonomy:
    setting: dynamic_spatiotemporal
    d1: "Sequence of graph snapshots"
    d2: "Temporal snapshot order"
    d3: [operator]
    d4: [standalone]
  methodology: "State-space formulation for discrete-time temporal graphs; GHIPPO incorporates structure through Laplacian regularization and a mixed discretization accounts for changes between snapshots."
  contributions:
    - "Integrates evolving topology directly into state evolution rather than reducing the graph to an arbitrary node sequence."
  verification: {status: extracted, flags: []}

- key: zhou2024graph
