# Published numerical results transcribed from Appendix A
# (app:performance-tables). All numbers are taken from the original
# publications as reported in the survey and were NOT reproduced.
# Results are only comparable WITHIN a table (same source paper,
# datasets, and protocol). `null` -> rendered as NR.
# `gm: true` marks the Graph Mamba / SSM-based rows highlighted in the survey.
tables:
  - id: perf_brain
    label: tab:Healthcompare
    caption: "Mean classification accuracy (%) on brain benchmarks"
    source: behrouz2024brain
    evidence: comparable
    columns:
      - {dataset: BVFC-MEG, metric: "Acc. (%)"}
      - {dataset: HCP-Mental, metric: "Acc. (%)"}
      - {dataset: HCP-Age, metric: "Acc. (%)"}
    better: [higher, higher, higher]
    rows:
      - {model: USAD, key: audibert2020usad, values: ["50.02 ± 1.13", "73.49 ± 1.56", "39.17 ± 1.68"]}
      - {model: GMM, key: he2023generalization, values: ["53.04 ± 1.73", "90.92 ± 1.83", "47.75 ± 1.26"]}
      - {model: GraphMixer, key: cong2023we, values: ["53.12 ± 1.18", "91.13 ± 1.44", "48.32 ± 1.11"]}
      - {model: BrainNetCNN, key: kawahara2017brainnetcnn, values: ["50.12 ± 1.57", "83.58 ± 1.68", "42.26 ± 2.03"]}
      - {model: BrainGNN, key: li2021braingnn, values: ["51.08 ± 0.96", "85.25 ± 2.17", "43.08 ± 1.54"]}
      - {model: FBNetGen, key: kan2022fbnetgen, values: ["50.94 ± 1.39", "84.47 ± 1.88", "42.83 ± 1.78"]}
      - {model: ADMIRE, key: behrouz2023admire++, values: ["54.87 ± 1.92", "89.74 ± 1.93", "47.82 ± 1.72"]}
      - {model: PTGB, key: yang2023ptgb, values: ["55.11 ± 1.62", "92.58 ± 1.31", "48.41 ± 1.47"]}
      - {model: BNTransformer, key: kan2022brain, values: ["55.17 ± 1.74", "91.71 ± 1.48", "47.94 ± 1.15"]}
      - {model: BrainMixer, key: behrouz2023learning, values: ["62.58 ± 1.12", "96.32 ± 0.29", "57.83 ± 1.03"]}
      - {model: GraphS4mer, key: tang2023modeling, gm: true, values: ["74.39 ± 0.92", "82.30 ± 1.83", "46.32 ± 1.09"]}
      - {model: BrainMamba, key: behrouz2024brain, gm: true, values: ["78.03 ± 1.69", "96.57 ± 1.05", "59.62 ± 1.71"]}
    interpretation: "BrainMamba reports the highest mean accuracy; its margin over BrainMixer on HCP-Mental/HCP-Age is small relative to the reported variability. GraphS4mer (non-selective S4) falls below several non-SSM baselines on HCP benchmarks."

  - id: perf_hsi
    label: tab:RScomparison
    caption: "Hyperspectral image classification"
    source: yang2024graphmamba
    evidence: comparable
    columns:
      - {dataset: Indian Pines, metric: OA}
      - {dataset: Indian Pines, metric: AA}
      - {dataset: Indian Pines, metric: Kappa}
      - {dataset: Salinas, metric: OA}
      - {dataset: Salinas, metric: AA}
      - {dataset: Salinas, metric: Kappa}
      - {dataset: UH2013, metric: OA}
      - {dataset: UH2013, metric: AA}
      - {dataset: UH2013, metric: Kappa}
      - {dataset: "—", metric: "Complexity (G)"}
    better: [higher, higher, higher, higher, higher, higher, higher, higher, higher, lower]
    rows:
      - {model: AB-LSTM, key: mei2021hyperspectral, values: ["56.68", "60.41", "51.02", "74.83", "83.89", "72.21", "79.61", "82.38", "77.97", null]}
      - {model: 3D CNN, key: hamida2018deep, values: ["65.83", "79.12", "61.38", "87.59", "92.96", "86.21", "71.84", "73.84", "69.54", "0.69"]}
      - {model: GAHT, key: mei2022hyperspectral, values: ["85.96", "92.96", "84.05", "94.21", "97.37", "93.56", "90.84", "92.13", "90.10", "4.27"]}
      - {model: GraphMamba (HSI), key: yang2024graphmamba, gm: true, values: ["96.43", "97.83", "95.91", "97.33", "98.66", "97.02", "95.62", "96.23", "95.27", "0.69"]}
    interpretation: "Supports complementary spatial (SpatialGCN) and spectral (HyperMamba) representations under the reported setting."

  - id: perf_spatiotemporal
    label: tab:TRperformance_comparison
    caption: "Spatio-temporal forecasting benchmarks"
    source: li2024stg
    evidence: comparable
    columns:
      - {dataset: PeMS04, metric: RMSE}
      - {dataset: PeMS04, metric: MAE}
      - {dataset: PeMS04, metric: "MAPE (%)"}
      - {dataset: HZMetro, metric: RMSE}
      - {dataset: HZMetro, metric: MAE}
      - {dataset: HZMetro, metric: "MAPE (%)"}
      - {dataset: KnowAir, metric: RMSE}
      - {dataset: KnowAir, metric: MAE}
      - {dataset: KnowAir, metric: "MAPE (%)"}
    better: [lower, lower, lower, lower, lower, lower, lower, lower, lower]
    rows:
      - {model: LSTM-based methods, key: "sutskever2014sequence,liu2020physical,tian2024air", values: ["40.49", "26.24", "19.30", "57.10", "35.27", "9.90", "30.88", "20.21", null]}
      - {model: STGCN, key: yu2017stgcn, values: ["35.55", "22.70", "14.59", "34.85", "21.33", "13.47", "11.46", "8.37", "11.26"]}
      - {model: STAEformer, key: liu2023spatio, values: ["30.18", "18.22", "11.98", "29.94", "18.85", "12.03", "8.69", "6.93", "9.89"]}
      - {model: STG-Mamba, key: li2024stg, gm: true, values: ["29.53", "18.09", "12.11", "29.23", "18.26", "11.59", "8.05", "6.37", "9.64"]}
    interpretation: "Lowest RMSE/MAE; no uncertainty estimates or component-level ablations, so the selective SSM contribution is not isolated."

  - id: perf_financial
    label: tab:FMcomparison
    caption: "Financial forecasting (RMSE) and training time"
    source: mehrabian2024mamba
    evidence: comparable
    columns:
      - {dataset: NASDAQ, metric: RMSE}
      - {dataset: NYSE, metric: RMSE}
      - {dataset: DJIA, metric: RMSE}
      - {dataset: "—", metric: "Training time (s/epoch)"}
    better: [lower, lower, lower, lower]
    rows:
      - {model: LSTM, key: moghar2020stock, values: ["0.0187", "0.0144", "0.0121", "0.081"]}
      - {model: Transformer, key: wang2022stock, values: ["0.0147", "0.0141", "0.0166", "1.91"]}
      - {model: FourierGNN, key: yi2024fouriergnn, values: ["0.0152", "0.0146", "0.0190", "1.10"]}
      - {model: SAMBA, key: mehrabian2024mamba, gm: true, values: ["0.0128", "0.0125", "0.0108", "0.891"]}
    interpretation: "Favorable predictive--computational trade-off within the reported setting."

  - id: perf_absa
    label: tab:SAperformance
    caption: "Aspect-based sentiment analysis"
    source: lawan2024mambaforgcn
    evidence: comparable
    columns:
      - {dataset: Restaurant14, metric: Accuracy}
      - {dataset: Restaurant14, metric: F1}
      - {dataset: Laptop14, metric: Accuracy}
      - {dataset: Laptop14, metric: F1}
      - {dataset: Twitter14, metric: Accuracy}
      - {dataset: Twitter14, metric: F1}
    better: [higher, higher, higher, higher, higher, higher]
    rows:
      - {model: CNN over BERT-GCN, key: phan2022aspect, values: ["85.25", "78.76", "78.59", "74.76", "74.03", "72.39"]}
      - {model: Dual-gated GCN, key: liu2023enhancing, values: ["83.66", "76.73", "75.70", "72.57", "74.87", "72.27"]}
      - {model: DGEDT, key: tang2020dependency, values: ["83.90", "75.10", "76.80", "72.30", "74.80", "73.40"]}
      - {model: MambaForGCN, key: lawan2024mambaforgcn, gm: true, values: ["86.68", "80.86", "81.80", "78.59", "77.67", "76.88"]}
    interpretation: "Supports complementary use of syntactic graph structure and state-space contextual modeling under the reported protocol."
