# Benchmarks used in the comparative analysis (tab:benchmark-summary).
# `models` lists BibTeX keys of the representative Graph Mamba models.
benchmarks:
  - id: peptides
    datasets: [Peptides-func, Peptides-struct]
    domain_task: "General graph learning"
    graph_setting: "Static molecular graphs"
    metrics: [AP, MAE]
    models: [wang2024graph, behrouz2024graph, huang2024can]
    results_table: null   # the survey reports no numeric results for these benchmarks
  - id: brain
    datasets: [BVFC-MEG, HCP-Mental, HCP-Age]
    domain_task: "Brain classification"
    graph_setting: "Brain-network / physiological graphs"
    metrics: [Accuracy]
    models: [tang2023modeling, behrouz2024brain]
    results_table: perf_brain
  - id: hsi
    datasets: [Indian Pines, Salinas, UH2013]
    domain_task: "Hyperspectral image classification"
    graph_setting: "Spectral--spatial graphs"
    metrics: [OA, AA, Kappa]
    models: [yang2024graphmamba]
    results_table: perf_hsi
  - id: spatiotemporal
    datasets: [PeMS04, HZMetro, KnowAir]
    domain_task: "Spatio-temporal forecasting"
    graph_setting: "Traffic / environmental graphs"
    metrics: [RMSE, MAE, MAPE]
    models: [li2024stg]
    results_table: perf_spatiotemporal
  - id: financial
    datasets: [NASDAQ, NYSE, DJIA]
    domain_task: "Financial forecasting"
    graph_setting: "Inter-asset graphs"
    metrics: [RMSE, training time]
    models: [mehrabian2024mamba]
    results_table: perf_financial
  - id: absa
    datasets: [Restaurant14, Laptop14, Twitter14]
    domain_task: "Aspect-based sentiment analysis"
    graph_setting: "Syntactic dependency graphs"
    metrics: [Accuracy, F1-score]
    models: [lawan2024mambaforgcn]
    results_table: perf_absa

metric_legend:
  AP: "Average Precision"
  MAE: "Mean Absolute Error"
  RMSE: "Root Mean Squared Error"
  MAPE: "Mean Absolute Percentage Error"
  OA: "Overall Accuracy"
  AA: "Average Accuracy"
  Kappa: "Cohen's Kappa coefficient"
