# Open challenges and future directions (tab:future-directions, Sec. 7).
# early_work entries reference BibTeX keys; `scope` qualifies non-graph work.
challenges:
  - id: scalability
    challenge: "End-to-end scalability and tooling"
    design_questions: [Ordering, Integration]
    section: sec:ch-hybrid
    directions: "Sparse graph-aware scanning, efficient serialization, graph partitioning; packed variable-length scans with state resets at graph boundaries, fused bidirectional and multi-order scans, portable reference implementations"
    early_work:
      - {key: huang2024can, label: GSSC}
      - {key: li2024state, label: GraphSSM}
      - {key: xu2024packmamba, label: PackMamba, scope: "sequence domain"}
      - {key: dao2024transformers, label: "SSD kernels", scope: "sequence domain"}
  - id: serialization
    challenge: "Serialization and permutation"
    design_questions: [Ordering, Coupling]
    section: sec:ch-serialization-robustness
    directions: "Learnable ordering, permutation-equivariant SSM operators, multi-order scans, topology-conditioned state transitions"
    early_work:
      - {key: wang2024graph, label: Graph-Mamba}
      - {key: behrouz2024graph, label: GMN}
      - {key: huang2024can, label: GSSC}
      - {key: zhao2024grassnet, label: GrassNet}
  - id: robustness
    challenge: "Robustness and distribution shift"
    design_questions: [Ordering]
    section: sec:ch-serialization-robustness
    directions: "Serializer-aware attacks and certified defenses, order-sensitivity metrics (eq:order-sensitivity), order-consistency regularization, evaluation on graph OOD benchmarks"
    early_work:
      - {key: yuan2025dg, label: DG-Mamba}
      - {key: li2024dyg, label: DyG-Mamba, scope: "spectral-norm constraints"}
  - id: expressivity
    challenge: "Expressive power"
    design_questions: [Tokenization, Coupling]
    section: sec:ch-expressivity
    directions: "Expressivity under canonical or expected orderings, state-dimension and depth bounds for graph tasks, isolating the roles of selectivity and of PE/SE"
    early_work:
      - {key: huang2024can, label: GSSC}
      - {key: behrouz2024graph, label: GMN}
      - {key: chen2026ccmamba, label: CCMamba}
      - {key: behrouz2024best, label: "Graph sequence models"}
  - id: complex_graphs
    challenge: "Dynamic and complex graphs"
    design_questions: [Tokenization, Ordering]
    section: sec:ch-complex-graphs
    directions: "Adaptive state transitions, type-aware state updates, temporal structural conditioning, rank-aware representations"
    early_work:
      - {key: li2024state, label: GraphSSM}
      - {key: ding2024dygmamba, label: DyGMamba}
      - {key: pan2024hetegraph, label: HeteGraph-Mamba}
      - {key: montagna2024topological, label: TopoMamba}
      - {key: chen2026ccmamba, label: CCMamba}
  - id: interpretability
    challenge: "Interpretability"
    design_questions: [Coupling, Integration]
    section: sec:ch-interpretability
    directions: "Retention-based node relevance maps validated by perturbation tests, stability of explanations across orderings, component-level explanations covering the local and gating branches"
    early_work:
      - {key: ali2025hidden, label: "Hidden-attention view of Mamba"}
      - {key: chen2026modeling, label: FuzzMamba}
      - {key: kotoge2026expath, label: ExPath}
  - id: pretraining
    challenge: "Self-supervision, pre-training, and foundation models"
    design_questions: [Tokenization, Ordering]
    section: sec:ch-pretraining
    directions: "Graph-specific pretext tasks suited to causal and bidirectional scans, transferable serializers and substructure tokenizers, cross-graph comparable encodings, size and length generalization, scaling studies"
    early_work:
      - {key: yuan2025dg, label: DG-Mamba}
      - {key: Meng2026Mamba-GTC, label: Mamba-GTC}
      - {key: fu2025gladmamba, label: GLADMamba}
      - {key: cheng2025transfer, label: Transfer-Mamba}
  - id: hybrid
    challenge: "Hybrid attention--SSM and SSD backbones"
    design_questions: [Coupling, Integration]
    section: sec:ch-hybrid
    directions: "Sparse or coarsened attention interleaved with SSM layers, graph-aware structured masks in the SSD form (eq:ssd-graph), non-causal SSD for unordered nodes, controlled Mamba vs. Mamba-2 comparisons"
    early_work:
      - {key: behrouz2024best, label: "GSM++"}
      - {key: wang2025mapstsf, label: MapsTSF}
      - {key: lieber2024jamba, label: Jamba, scope: "outside graphs"}
      - {key: shi2025vssd, label: VSSD, scope: "outside graphs"}
  - id: crossmodal
    challenge: "Cross-modal graph modeling"
    design_questions: [Integration]
    section: sec7
    directions: "Cross-modal state conditioning, graph-token alignment, multimodal selective fusion"
    early_work:
      - {key: gubbala2026m3, label: M3-HGMA}
      - {key: behrouz2024brain, label: BrainMamba}
