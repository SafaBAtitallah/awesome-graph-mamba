# =====================================================================
# Taxonomy of the survey "Exploring Graph Mamba: A Comprehensive Survey
# on State-Space Models for Graph Learning" (ACM CSUR, Revision 1).
#
# Every definition below is transcribed from the manuscript; the
# manuscript label it comes from is given in `source`.
# This file is the single source of truth for valid category values.
# =====================================================================

survey:
  title: "Exploring Graph Mamba: A Comprehensive Survey on State-Space Models for Graph Learning"
  short_title: "Exploring Graph Mamba"
  venue: "ACM Computing Surveys (under revision, Ms. Ref. ACM CSUR-2024-1225)"
  authors:
    - {name: "Safa Ben Atitallah", orcid: "0000-0003-0796-3507", affiliation: "Robotics & Internet of Things Lab, Prince Sultan University; University of Manouba"}
    - {name: "Chaima Ben Rabah", affiliation: "Weill Cornell Medicine, Qatar; University of Manouba"}
    - {name: "Maha Driss", orcid: "0000-0001-8236-8746", affiliation: "Alfaisal University; University of Manouba"}
    - {name: "Wadii Boulila", orcid: "0000-0003-2133-0757", affiliation: "Robotics & Internet of Things Lab, Prince Sultan University; University of Manouba"}
    - {name: "Anis Koubaa", orcid: "0000-0003-3787-7423", affiliation: "Alfaisal University"}
  keywords: ["State Space Models", "Selective State Space Models", "Mamba", "Graph Mamba", "Graph Learning", "Graph Serialization"]
  repository: "https://github.com/SafaBAtitallah/awesome-graph-mamba"   # set to the public repo URL (used by the dashboard)
  search_window: "2023 to September 2026"
  databases: ["IEEE Xplore", "ACM Digital Library", "Scopus", "Web of Science", "Google Scholar"]

research_questions:
  - id: RQ1
    question: "How is graph structure incorporated into selective state-space modeling?"
    scope: "Token construction, node ordering, serialization, state-space operators, structural conditioning, and graph--SSM feature integration (tokenization, ordering, coupling, integration)."
    sections: [sec:taxonomy, sec:applications]
  - id: RQ2
    question: "What architectural, structural, and computational implications follow from these design choices?"
    scope: "Permutation properties, order sensitivity, long-range information propagation, scalability, and overhead of graph construction and serialization."
    sections: [sec:structural-properties]
  - id: RQ3
    question: "Under which graph settings, tasks, datasets, and evaluation conditions are the reported advantages of Graph Mamba supported?"
    scope: "Benchmark practices, dataset characteristics, reported performance, and comparability of results across studies."
    sections: [sec:evaluation]
  - id: RQ4
    question: "Which unresolved challenges currently limit reliable progress in Graph Mamba?"
    scope: "Robustness, expressive power, implementation efficiency, interpretability, pre-training, and future state-space backbones."
    sections: [sec6]

contributions:
  - "A unified architectural perspective on Graph Mamba, clarifying how graph information is transformed, serialized, and integrated into selective state-space computation."
  - "A taxonomy based on four design questions (tokenization, ordering, coupling, and integration), with input-, dynamics-, and operator-level coupling."
  - "A synthesis of Graph Mamba applications, structural and computational trade-offs, evaluation practices, and reported performance across diverse graph-learning settings."
  - "Identification of current limitations and open research directions related to robustness, scalability, interpretability, reproducibility, and future Graph Mamba designs."

# ---------------------------------------------------------------------
# Architectural taxonomy (Sec. 3, tab:taxonomy-dimensions)
# ---------------------------------------------------------------------
dimensions:
  - id: D1
    name: Tokenization
    aspect: "Graph representation and token construction"
    question: "What information is presented to the state-space model?"
    choices: "Nodes, neighborhoods, walks, metapaths, spectral components, snapshots, higher-order cells"
    structural_implication: "Controls which local, semantic, temporal, or higher-order information reaches the SSM"
    trade_off: "Richer tokens may improve structural context but introduce sampling, encoding, or representation-construction cost"
    cost_term: "T_token"
  - id: D2
    name: Ordering
    aspect: "Serialization, scanning, and directionality"
    question: "How are graph-derived representations ordered and traversed?"
    choices: "Structural ranking, traversal, temporal ordering, type-aware or rank-aware ordering, uni-/bi-/multi-directional scanning"
    structural_implication: "Determines adjacency in the processed sequence and therefore the context seen by the recurrent state"
    trade_off: "Structurally meaningful order can improve context organization, but serialization-based models may remain sensitive to the selected ordering"
    cost_term: "T_serialize"
  - id: D3
    name: Coupling
    aspect: "Structural conditioning of state-space computation"
    question: "Does graph information directly affect the selective state dynamics?"
    choices: "Graph-conditioned B_t, C_t, or Delta_t; modified transition; graph-aware state-space operator"
    structural_implication: "Allows graph, temporal, or structural information to influence state evolution more directly"
    trade_off: "Tighter graph--SSM coupling introduces additional architecture-specific computation and reduces the ability to analyze the SSM independently"
    cost_term: "T_SSM"
    levels:
      - {id: input, label: "Input-level", definition: "The graph shapes only the tokens and their order."}
      - {id: dynamics, label: "Dynamics-level", definition: "Graph information conditions the selective parameters, the discretization, or the transition."}
      - {id: operator, label: "Operator-level", definition: "The state-space operator itself is defined on the graph."}
  - id: D4
    name: Integration
    aspect: "Integration with graph propagation or attention"
    question: "How is the SSM combined with other graph-learning mechanisms?"
    choices: "Parallel local--global branches, graph encoder followed by Mamba, embedded state evolution, attention--SSM hybrids (classified by how the SSM branch is integrated)"
    structural_implication: "Combines complementary local graph processing with state-space context modeling"
    trade_off: "Additional branches or fusion mechanisms increase end-to-end computation and make performance gains harder to attribute to a single component"
    cost_term: "T_fusion"
    types:
      - {id: standalone, label: "Standalone", definition: "The SSM runs without a separate graph-propagation branch."}
      - {id: sequential, label: "Sequential", definition: "The SSM follows or precedes a graph encoder."}
      - {id: parallel, label: "Parallel", definition: "The SSM runs in parallel with a graph encoder and the outputs are fused."}
      - {id: embedded, label: "Embedded", definition: "The SSM is embedded inside graph propagation."}

graph_settings:
  - id: static_general
    label: "Static and General-Purpose Graph Models"
    section: subsec:static-models
    emphasis: "Ordering is decisive because nodes have no natural sequence."
  - id: dynamic_spatiotemporal
    label: "Dynamic and Spatio-Temporal Graph Models"
    section: subsec:dynamic-models
    emphasis: "Time largely answers the ordering question, so design effort shifts to coupling."
  - id: heterogeneous_higher_order
    label: "Heterogeneous and Higher-Order Graph Models"
    section: subsec:heterogeneous-higherorder
    emphasis: "Most structure is carried by tokenization."

# ---------------------------------------------------------------------
# Applications (Sec. 5, fig:design-patterns, tab:cross-domain-applications)
# ---------------------------------------------------------------------
design_patterns:
  - {id: DV, label: "Dual-view", definition: "Graph and SSM components process complementary views or modalities."}
  - {id: RT, label: "Relational--temporal", definition: "Graph representations capture relations and the SSM models temporal evolution (time orders the sequence)."}
  - {id: GS, label: "Graph-guided sequence", definition: "Graph structure guides tokenization, ordering, or scanning."}
  - {id: LG, label: "Local-to-global", definition: "Local graph processing is combined with broader state-space context modeling."}

application_domains:
  - id: healthcare
    label: "Healthcare and Biomedical Applications"
    section: sec:healthcare
    subdomains:
      - {id: neural_signals, label: "Neural and physiological signals"}
      - {id: clinical_molecular, label: "Clinical, biological, and molecular data"}
      - {id: histopathology, label: "Histopathology"}
      - {id: medical_imaging, label: "Medical imaging"}
  - id: remote_visual
    label: "Remote Sensing and Structured Visual Applications"
    section: sec:remote-visual
    subdomains:
      - {id: remote_sensing, label: "Remote sensing"}
      - {id: articulated_motion, label: "Articulated and human motion"}
  - id: other
    label: "Other Application Areas"
    section: sec:other-areas
    subdomains:
      - {id: financial, label: "Financial forecasting"}
      - {id: industrial, label: "Industrial prognostics"}
      - {id: cybersecurity, label: "Cybersecurity and intrusion detection"}
      - {id: language, label: "Language and semantic modeling"}

# Roles a cited work can play in the survey
roles:
  - {id: taxonomy, label: "Architecture classified in the unified taxonomy (tab:unified-taxonomy)"}
  - {id: application, label: "Domain application classified by design pattern (tab:cross-domain-applications)"}
  - {id: discussed, label: "Graph Mamba model discussed in Sec. 7 (challenges) but not classified in the survey taxonomy"}

# Evidence categories (Sec. 6.1, sec:evidence-protocol)
evidence_levels:
  - {id: comparable, label: "Comparable published results", definition: "Results reported under sufficiently similar datasets, tasks, metrics, and evaluation protocols to support a meaningful comparison."}
  - {id: contextual, label: "Contextual results", definition: "Results obtained under substantially different settings; used only to indicate broader performance trends."}

# Reference rows of tab:expressivity (not Graph Mamba models)
expressivity_references:
  - model: "MPNNs (reference)"
    keys: [xu2018powerful, morris2019weisfeiler]
    permutation_property: "Equivariant"
    result: "Upper-bounded by 1-WL"
    caveat: "Cannot count cycles; limited long-range propagation"
  - model: "Graph Transformers (reference)"
    keys: [kreuzer2021rethinking, muller2023attending]
    permutation_property: "Equivariant given equivariant PE/SE"
    result: "Universal approximation with sufficiently expressive PE/SE"
    caveat: "Power resides in the PE/SE; quadratic cost of global attention"

# Conceptual cost decomposition (eq:end-to-end-cost)
cost_decomposition: "T_total = T_graph + T_token + T_serialize + T_SSM + T_fusion + T_readout"

abbreviations:
  SSM: "State-Space Model"
  GNN: "Graph Neural Network"
  MPNN: "Message Passing Neural Network"
  PE/SE: "Positional / Structural Encodings"
  WL: "Weisfeiler--Lehman test"
  NR: "Not Reported in the survey"
  "†": "S4-type or structured-SSM precursor without Mamba-style input-dependent selection"
  "◆": "Multimodal input"
